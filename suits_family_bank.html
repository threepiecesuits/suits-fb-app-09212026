<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suits Family Bank</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome for standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Expose Firebase to the window object so Babel/React can use it easily
        window.Firebase = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, signInWithPopup, GoogleAuthProvider, onAuthStateChanged,
            getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, serverTimestamp, setDoc
        };
        
        // Let the app know Firebase is loaded
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_PROFILES = {
            parents: [
                { id: 'matt', name: 'Matt', role: 'parent' },
                { id: 'meredith', name: 'Meredith', role: 'parent' }
            ],
            kids: [
                { id: 'sam', name: 'Sam', role: 'kid' },
                { id: 'charlotte', name: 'Charlotte', role: 'kid' }
            ]
        };

        const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'Anytime'];

        function App() {
            const [fb, setFb] = useState(null);
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [userAuth, setUserAuth] = useState(null);
            
            const [currentUser, setCurrentUser] = useState(null);
            const [chores, setChores] = useState([]);
            const [customAvatars, setCustomAvatars] = useState({});
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            
            // Dashboard UI States
            const [showSettings, setShowSettings] = useState(false);
            const [historyFilter, setHistoryFilter] = useState('7d');
            const [isAdding, setIsAdding] = useState(false);
            const [newChore, setNewChore] = useState({ 
                title: '', amount: '', assignee: 'Sam', dayOfWeek: 'Anytime', isWeekly: false 
            });

            // Avatar Upload References
            const fileInputRef = useRef(null);
            const [uploadingFor, setUploadingFor] = useState(null);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'suits-family-bank';

            useEffect(() => {
                const initFirebase = () => {
                    const { initializeApp, getAuth, getFirestore, signInWithCustomToken, signInAnonymously, onAuthStateChanged } = window.Firebase;
                    
                    let config;
                    if (typeof __firebase_config !== 'undefined') {
                        config = JSON.parse(__firebase_config);
                    } else {
                        // NOTE: If deploying to GitHub Pages outside of this tool, you must supply 
                        // your own free Firebase Config below to enable multi-device syncing!
                        config = { 
                            apiKey: "demo", 
                            projectId: "demo" 
                        };
                    }

                    try {
                        const app = initializeApp(config);
                        const authInstance = getAuth(app);
                        const dbInstance = getFirestore(app);
                        
                        setFb(window.Firebase);
                        setAuth(authInstance);
                        setDb(dbInstance);

                        onAuthStateChanged(authInstance, (user) => {
                            setUserAuth(user);
                        });

                        // Prioritize custom tokens if available, else anonymous connection
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            signInWithCustomToken(authInstance, __initial_auth_token).catch(console.error);
                        } else {
                            signInAnonymously(authInstance).catch(console.error);
                        }
                    } catch (err) {
                        console.error("Firebase init error:", err);
                        setError("Database not connected. Sync may be disabled.");
                        setLoading(false);
                    }
                };

                if (window.Firebase) {
                    initFirebase();
                } else {
                    window.addEventListener('firebase-ready', initFirebase);
                }
                return () => window.removeEventListener('firebase-ready', initFirebase);
            }, []);

            useEffect(() => {
                if (!userAuth || !db || !fb) return;

                // Sync Chores
                const choresRef = fb.collection(db, 'artifacts', appId, 'public', 'data', 'chores');
                const unsubscribeChores = fb.onSnapshot(choresRef, (snapshot) => {
                    const choresData = [];
                    snapshot.forEach((doc) => {
                        choresData.push({ id: doc.id, ...doc.data() });
                    });
                    // Sort newest first
                    choresData.sort((a, b) => {
                        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                        return timeB - timeA;
                    });
                    setChores(choresData);
                    setLoading(false);
                }, (err) => {
                    console.error("Firestore sync error:", err);
                    setLoading(false);
                });

                // Sync Avatars
                const avatarsRef = fb.collection(db, 'artifacts', appId, 'public', 'data', 'avatars');
                const unsubscribeAvatars = fb.onSnapshot(avatarsRef, (snapshot) => {
                    const avatarData = {};
                    snapshot.forEach((doc) => {
                        avatarData[doc.id] = doc.data().base64;
                    });
                    setCustomAvatars(avatarData);
                });

                return () => {
                    unsubscribeChores();
                    unsubscribeAvatars();
                };
            }, [userAuth, db, fb]);

            const handleParentLogin = async (profile) => {
                if (auth && fb) {
                    try {
                        const provider = new fb.GoogleAuthProvider();
                        await fb.signInWithPopup(auth, provider);
                        setCurrentUser(profile);
                    } catch (err) {
                        console.warn("Google Login bypassed or failed, continuing locally.", err);
                        setCurrentUser(profile);
                    }
                } else {
                    setCurrentUser(profile);
                }
            };

            const handleAddChore = async (e) => {
                e.preventDefault();
                if (!newChore.title || !newChore.amount || !db || !fb) return;

                try {
                    const choresRef = fb.collection(db, 'artifacts', appId, 'public', 'data', 'chores');
                    await fb.addDoc(choresRef, {
                        title: newChore.title,
                        amount: parseFloat(newChore.amount),
                        assignee: newChore.assignee,
                        dayOfWeek: newChore.dayOfWeek,
                        isWeekly: newChore.isWeekly,
                        status: 'pending',
                        createdBy: currentUser.name,
                        createdAt: fb.serverTimestamp()
                    });
                    setNewChore({ title: '', amount: '', assignee: 'Sam', dayOfWeek: 'Anytime', isWeekly: false });
                    setIsAdding(false);
                } catch (err) {
                    console.error(err);
                    setError("Failed to assign chore.");
                }
            };

            const toggleChoreStatus = async (chore) => {
                if (!db || !fb) return;
                // Only assignee or parent can toggle
                if (currentUser.role === 'kid' && currentUser.name !== chore.assignee) return;

                const newStatus = chore.status === 'pending' ? 'completed' : 'pending';
                try {
                    const choreRef = fb.doc(db, 'artifacts', appId, 'public', 'data', 'chores', chore.id);
                    await fb.updateDoc(choreRef, { 
                        status: newStatus, 
                        completedAt: newStatus === 'completed' ? fb.serverTimestamp() : null 
                    });
                } catch (err) {
                    console.error(err);
                }
            };

            const deleteChore = async (choreId) => {
                if (!db || !fb || currentUser.role !== 'parent') return;
                try {
                    const choreRef = fb.doc(db, 'artifacts', appId, 'public', 'data', 'chores', choreId);
                    await fb.deleteDoc(choreRef);
                } catch (err) {
                    console.error(err);
                }
            };

            const handlePayout = async (kidName) => {
                if (!db || !fb || currentUser.role !== 'parent') return;
                const choresToPay = chores.filter(c => c.assignee === kidName && c.status === 'completed');
                if (choresToPay.length === 0) return;

                try {
                    await Promise.all(choresToPay.map(chore => {
                        const choreRef = fb.doc(db, 'artifacts', appId, 'public', 'data', 'chores', chore.id);
                        return fb.updateDoc(choreRef, { status: 'paid', paidAt: fb.serverTimestamp() });
                    }));
                } catch (err) {
                    console.error(err);
                    setError("Failed to record payout.");
                }
            };

            const triggerImageUpload = (userId) => {
                setUploadingFor(userId);
                if (fileInputRef.current) fileInputRef.current.click();
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !uploadingFor || !db || !fb) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        // Compress and resize avatar inline for fast syncing
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 150;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64Data = canvas.toDataURL('image/jpeg', 0.8);

                        try {
                            const avatarRef = fb.doc(db, 'artifacts', appId, 'public', 'data', 'avatars', uploadingFor);
                            await fb.setDoc(avatarRef, { base64: base64Data, updatedAt: fb.serverTimestamp() });
                        } catch (err) {
                            console.error(err);
                            setError("Failed to save avatar.");
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            const balances = useMemo(() => {
                return DEFAULT_PROFILES.kids.reduce((acc, kid) => {
                    acc[kid.name] = chores
                        .filter(c => c.assignee === kid.name && c.status === 'completed')
                        .reduce((sum, c) => sum + c.amount, 0);
                    return acc;
                }, {});
            }, [chores]);

            const kidChoresByDay = useMemo(() => {
                if (!currentUser || currentUser.role !== 'kid') return {};
                const grouped = {};
                DAYS_OF_WEEK.forEach(day => grouped[day] = []);
                
                chores.forEach(chore => {
                    if (chore.assignee === currentUser.name && chore.status !== 'paid') {
                        const day = chore.dayOfWeek || 'Anytime';
                        if (grouped[day]) grouped[day].push(chore);
                        else grouped['Anytime'].push(chore);
                    }
                });
                return grouped;
            }, [chores, currentUser]);

            const filteredHistory = useMemo(() => {
                const paidChores = chores.filter(c => c.status === 'paid');
                const now = Date.now();
                return paidChores.filter(c => {
                    if (!c.paidAt || !c.paidAt.toMillis) return true;
                    const paidTime = c.paidAt.toMillis();
                    const diffDays = (now - paidTime) / (1000 * 60 * 60 * 24);
                    switch(historyFilter) {
                        case '7d': return diffDays <= 7;
                        case '30d': return diffDays <= 30;
                        case 'year': return diffDays <= 365;
                        case 'all': default: return true;
                    }
                }).sort((a, b) => {
                    const tA = a.paidAt?.toMillis ? a.paidAt.toMillis() : 0;
                    const tB = b.paidAt?.toMillis ? b.paidAt.toMillis() : 0;
                    return tB - tA;
                });
            }, [chores, historyFilter]);

            // Default to initials service if no photo is uploaded yet
            const getAvatar = (id, name) => customAvatars[id] || `https://ui-avatars.com/api/?name=${name}&background=random`;

            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 space-y-8 border border-slate-100">
                            <div className="text-center space-y-2">
                                <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-2">
                                    <i className="fas fa-piggy-bank text-3xl"></i>
                                </div>
                                <h1 className="text-3xl font-extrabold tracking-tight text-slate-900">Suits Family Bank</h1>
                                <p className="text-slate-500 font-medium text-sm">Select your profile to continue</p>
                            </div>

                            <div className="space-y-6">
                                <div>
                                    <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2 flex items-center gap-2">
                                        <i className="fas fa-shield-alt"></i> Parents (Google Login)
                                    </h2>
                                    <div className="grid grid-cols-2 gap-4">
                                        {DEFAULT_PROFILES.parents.map(profile => (
                                            <button key={profile.id} onClick={() => handleParentLogin(profile)}
                                                className="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-2xl hover:bg-indigo-50 border border-slate-100 group transition-all active:scale-95">
                                                <img src={getAvatar(profile.id, profile.name)} className="w-16 h-16 rounded-full object-cover mb-2 border-2 border-white shadow-sm group-hover:scale-105 transition-transform"/>
                                                <span className="font-bold text-slate-700">{profile.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2 flex items-center gap-2">
                                        <i className="fas fa-user"></i> Kids
                                    </h2>
                                    <div className="grid grid-cols-2 gap-4">
                                        {DEFAULT_PROFILES.kids.map(profile => (
                                            <button key={profile.id} onClick={() => setCurrentUser(profile)}
                                                className="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-2xl hover:bg-emerald-50 border border-slate-100 group transition-all active:scale-95">
                                                <img src={getAvatar(profile.id, profile.name)} className="w-16 h-16 rounded-full object-cover mb-2 border-2 border-white shadow-sm group-hover:scale-105 transition-transform"/>
                                                <span className="font-bold text-slate-700">{profile.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="hidden" />

                    {/* App Header */}
                    <header className="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-100">
                        <div className="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src={getAvatar(currentUser.id, currentUser.name)} className="w-9 h-9 rounded-full object-cover shadow-sm border border-slate-200" />
                                <div>
                                    <span className="font-bold text-base block leading-tight">{currentUser.name}'s Dashboard</span>
                                    <span className="text-[10px] uppercase font-extrabold text-indigo-600 tracking-wider">Suits Family Bank</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                {currentUser.role === 'parent' && (
                                    <button onClick={() => setShowSettings(true)} className="p-2 text-slate-400 hover:text-indigo-600 bg-slate-50 hover:bg-indigo-50 rounded-full transition-colors">
                                        <i className="fas fa-cog"></i>
                                    </button>
                                )}
                                <button onClick={() => setCurrentUser(null)} className="p-2 text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 rounded-full transition-colors">
                                    <i className="fas fa-sign-out-alt"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {error && (
                        <div className="max-w-3xl mx-auto p-4 m-4 bg-red-50 text-red-600 rounded-xl border border-red-100 text-sm flex justify-between">
                            <span>{error}</span>
                            <button onClick={() => setError('')}><i className="fas fa-times"></i></button>
                        </div>
                    )}

                    {}
                    {showSettings && currentUser.role === 'parent' && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
                                <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                                    <h2 className="font-bold text-lg"><i className="fas fa-cog text-indigo-600 mr-2"></i>Settings & Avatars</h2>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 bg-slate-50 rounded-full p-2 hover:bg-slate-100 transition-colors"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="p-6">
                                    <h3 className="text-sm font-semibold text-slate-500 mb-2 uppercase">Customize Profile Photos</h3>
                                    <p className="text-xs text-slate-400 mb-4">Tap any profile picture to upload a custom photo.</p>
                                    <div className="grid grid-cols-4 gap-4">
                                        {[...DEFAULT_PROFILES.parents, ...DEFAULT_PROFILES.kids].map(profile => (
                                            <div key={profile.id} className="flex flex-col items-center gap-2">
                                                <button onClick={() => triggerImageUpload(profile.id)} className="relative group rounded-full overflow-hidden border-2 border-transparent hover:border-indigo-400 transition-all shadow-sm">
                                                    <img src={getAvatar(profile.id, profile.name)} className="w-14 h-14 object-cover" />
                                                    <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <i className="fas fa-upload text-white text-xs"></i>
                                                    </div>
                                                </button>
                                                <span className="text-xs font-medium text-slate-600">{profile.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-3xl mx-auto p-4 space-y-8 mt-4">
                        
                        {}
                        {currentUser.role === 'parent' && (
                            <div className="space-y-8">
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {DEFAULT_PROFILES.kids.map(kid => (
                                        <div key={kid.id} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden group">
                                            <div className="flex items-center gap-3 mb-3 relative z-10">
                                                <img src={getAvatar(kid.id, kid.name)} className="w-10 h-10 rounded-full object-cover border border-slate-200" />
                                                <div>
                                                    <h3 className="text-slate-700 font-bold">{kid.name}'s Allowance</h3>
                                                    <p className="text-xs text-slate-400">Pending transfer</p>
                                                </div>
                                            </div>
                                            <div className="text-4xl font-extrabold text-slate-800 my-2 relative z-10">${balances[kid.name].toFixed(2)}</div>
                                            
                                            <button 
                                                onClick={() => handlePayout(kid.name)}
                                                disabled={balances[kid.name] === 0}
                                                className={`mt-4 w-full py-3.5 rounded-2xl font-semibold flex items-center justify-center gap-2 transition-all relative z-10 ${
                                                    balances[kid.name] > 0 ? 'bg-indigo-600 text-white hover:bg-indigo-700 active:scale-95 shadow-md shadow-indigo-200' : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                                                }`}
                                            >
                                                <i className="fas fa-dollar-sign"></i> Transfer to {kid.name}'s Account
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                    {isAdding ? (
                                        <form onSubmit={handleAddChore} className="p-6 space-y-5 bg-gradient-to-b from-indigo-50/50 to-white">
                                            <h3 className="font-bold text-indigo-900 text-lg flex items-center"><i className="fas fa-plus mr-2 text-indigo-600"></i>Assign New Chore</h3>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wide">Chore Title</label>
                                                <input type="text" value={newChore.title} onChange={e => setNewChore({...newChore, title: e.target.value})} placeholder="e.g. Empty dishwasher" className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" required />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wide">Assign To</label>
                                                    <select value={newChore.assignee} onChange={e => setNewChore({...newChore, assignee: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                                                        {DEFAULT_PROFILES.kids.map(k => <option key={k.id}>{k.name}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wide">Amount ($)</label>
                                                    <input type="number" step="0.25" value={newChore.amount} onChange={e => setNewChore({...newChore, amount: e.target.value})} placeholder="2.50" className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" required />
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4 items-center">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wide">Ideal Day</label>
                                                    <select value={newChore.dayOfWeek} onChange={e => setNewChore({...newChore, dayOfWeek: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                                                        {DAYS_OF_WEEK.map(d => <option key={d}>{d}</option>)}
                                                    </select>
                                                </div>
                                                <div className="pt-5">
                                                    <label className="flex items-center gap-2 cursor-pointer group">
                                                        <input type="checkbox" checked={newChore.isWeekly} onChange={e => setNewChore({...newChore, isWeekly: e.target.checked})} className="w-5 h-5 accent-indigo-600 cursor-pointer" />
                                                        <span className="text-sm font-semibold text-slate-700 group-hover:text-indigo-600 transition-colors">Recurring Weekly</span>
                                                    </label>
                                                </div>
                                            </div>
                                            <div className="flex gap-3 pt-4 border-t border-slate-100">
                                                <button type="submit" className="flex-1 bg-slate-900 text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-slate-800 transition-colors active:scale-95">Assign Chore</button>
                                                <button type="button" onClick={() => setIsAdding(false)} className="px-6 py-3.5 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">Cancel</button>
                                            </div>
                                        </form>
                                    ) : (
                                        <button onClick={() => setIsAdding(true)} className="w-full p-5 text-left flex items-center gap-4 text-indigo-600 font-bold hover:bg-indigo-50 group transition-colors">
                                            <div className="bg-indigo-100 p-2.5 rounded-xl group-hover:scale-110 transition-transform"><i className="fas fa-plus"></i></div>
                                            Create a new chore assignment
                                        </button>
                                    )}
                                </div>

                                <div>
                                    <h2 className="text-xl font-bold px-1 mb-3 text-slate-800">Active Assignments</h2>
                                    <div className="space-y-3">
                                        {chores.filter(c => c.status !== 'paid').map(chore => (
                                            <div key={chore.id} className={`bg-white p-4 sm:p-5 rounded-2xl shadow-sm border flex items-center justify-between transition-all ${chore.status === 'completed' ? 'border-emerald-200 bg-emerald-50/50' : 'border-slate-100 hover:border-indigo-100'}`}>
                                                <div className="flex items-center gap-4 flex-1">
                                                    <button onClick={() => toggleChoreStatus(chore)} className={`text-3xl transition-transform hover:scale-110 active:scale-90 flex-shrink-0 ${chore.status === 'completed' ? 'text-emerald-500' : 'text-slate-300'}`}>
                                                        <i className={chore.status === 'completed' ? 'fas fa-check-circle' : 'far fa-circle'}></i>
                                                    </button>
                                                    <div className="min-w-0">
                                                        <p className={`font-bold text-lg truncate ${chore.status === 'completed' ? 'line-through text-emerald-900/70' : 'text-slate-800'}`}>
                                                            {chore.title} {chore.isWeekly && <i className="fas fa-sync-alt text-indigo-400 text-xs ml-1"></i>}
                                                        </p>
                                                        <div className="flex flex-wrap gap-2 text-xs font-bold text-slate-500 mt-1">
                                                            <span className="bg-slate-100 px-2 py-1 rounded-md border border-slate-200">{chore.assignee}</span>
                                                            <span className="text-emerald-700 bg-emerald-100 px-2 py-1 rounded-md">${chore.amount.toFixed(2)}</span>
                                                            <span className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-md">{chore.dayOfWeek}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <button onClick={() => deleteChore(chore.id)} className="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2.5 rounded-xl transition-colors ml-2"><i className="fas fa-trash"></i></button>
                                            </div>
                                        ))}
                                        {chores.filter(c => c.status !== 'paid').length === 0 && (
                                            <div className="text-center py-10 px-4 bg-white border border-slate-100 rounded-3xl shadow-sm">
                                                <i className="fas fa-check-double text-3xl text-slate-300 mb-3 block"></i>
                                                <p className="text-slate-500 font-medium">No active chores assigned.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {}
                                <div className="pt-6 border-t border-slate-200">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                                        <h2 className="text-xl font-bold text-slate-800 flex items-center"><i className="fas fa-history text-indigo-600 mr-2"></i>Payout History</h2>
                                        
                                        <div className="flex items-center bg-white border border-slate-200 rounded-xl p-1 shadow-sm w-full sm:w-auto">
                                            {[
                                                { id: '7d', label: '7 Days' },
                                                { id: '30d', label: '30 Days' },
                                                { id: 'year', label: 'This Year' },
                                                { id: 'all', label: 'All Time' }
                                            ].map(f => (
                                                <button
                                                    key={f.id}
                                                    onClick={() => setHistoryFilter(f.id)}
                                                    className={`px-3 py-1.5 text-xs font-bold rounded-lg whitespace-nowrap transition-colors flex-1 sm:flex-none ${
                                                        historyFilter === f.id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:bg-slate-50'
                                                    }`}
                                                >
                                                    {f.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden divide-y divide-slate-50">
                                        {filteredHistory.map(chore => (
                                            <div key={chore.id} className="p-4 flex justify-between items-center hover:bg-slate-50 transition-colors">
                                                <div>
                                                    <p className="font-semibold text-slate-700">{chore.title}</p>
                                                    <p className="text-xs text-slate-400 font-medium mt-0.5">Paid to {chore.assignee}'s Account</p>
                                                </div>
                                                <span className="font-bold text-slate-800 bg-slate-100 px-3 py-1 rounded-lg">${chore.amount.toFixed(2)}</span>
                                            </div>
                                        ))}
                                        {filteredHistory.length === 0 && <p className="p-8 text-center text-slate-400 font-medium text-sm">No payouts found for this timeframe.</p>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {currentUser.role === 'kid' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden">
                                    <i className="fas fa-piggy-bank absolute right-0 bottom-0 text-white opacity-10 text-9xl translate-x-1/4 translate-y-1/4"></i>
                                    <div className="relative z-10">
                                        <p className="text-indigo-100 text-xs font-semibold uppercase tracking-wide mb-1">Ready to Transfer to {currentUser.name}'s Account</p>
                                        <p className="text-5xl sm:text-6xl font-extrabold tracking-tight">${balances[currentUser.name].toFixed(2)}</p>
                                    </div>
                                </div>

                                <h2 className="text-2xl font-bold flex items-center text-slate-800 px-1"><i className="far fa-calendar-alt text-indigo-600 mr-3 text-xl"></i>My Schedule</h2>
                                
                                {DAYS_OF_WEEK.map(day => {
                                    const dayChores = kidChoresByDay[day];
                                    if (!dayChores?.length) return null;
                                    return (
                                        <div key={day} className="space-y-3">
                                            <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest border-l-4 border-indigo-300 pl-3 py-1">{day}</h3>
                                            <div className="space-y-3">
                                                {dayChores.map(chore => (
                                                    <div key={chore.id} onClick={() => toggleChoreStatus(chore)} className={`bg-white p-4 sm:p-5 rounded-2xl shadow-sm border flex items-center gap-4 cursor-pointer transition-all group hover:shadow-md ${chore.status === 'completed' ? 'border-emerald-200 bg-emerald-50/50' : 'border-slate-100 hover:border-indigo-200'}`}>
                                                        <button className={`text-4xl transition-transform group-active:scale-90 flex-shrink-0 ${chore.status === 'completed' ? 'text-emerald-500' : 'text-slate-200 group-hover:text-indigo-400'}`}>
                                                            <i className={chore.status === 'completed' ? 'fas fa-check-circle' : 'far fa-circle'}></i>
                                                        </button>
                                                        <div className="flex-1 min-w-0">
                                                            <p className={`font-bold text-lg sm:text-xl truncate ${chore.status === 'completed' ? 'line-through text-emerald-900/70' : 'text-slate-800'}`}>{chore.title}</p>
                                                            <div className="mt-1.5 flex flex-wrap gap-2 text-sm font-bold">
                                                                <span className="text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-lg">+ ${chore.amount.toFixed(2)}</span>
                                                                {chore.isWeekly && <span className="text-slate-500 bg-slate-100 px-2 py-1 rounded-lg text-xs flex items-center"><i className="fas fa-sync-alt mr-1"></i> Weekly</span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                                
                                {Object.values(kidChoresByDay).every(arr => arr.length === 0) && (
                                    <div className="text-center py-16 px-4 bg-white rounded-3xl border border-dashed border-slate-200">
                                        <div className="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-300">
                                            <i className="fas fa-check-circle text-4xl"></i>
                                        </div>
                                        <h3 className="font-bold text-slate-700 text-xl">All caught up!</h3>
                                        <p className="text-slate-500 mt-2 font-medium">You have no chores assigned right now.</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // Initialize React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
